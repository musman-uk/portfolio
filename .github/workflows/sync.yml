name: Sync Dev to Backup-Source

on:
  workflow_dispatch:
    branches:
      - dev
  schedule:
    - cron: "0 21 * * *"   # every night at 21:00 UTC (9pm)
  push:
    branches:
      - dev

jobs:
  sync:
    # Guard: only run if the workflow is triggered from dev
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger → use your details
            git config user.name "musman-uk"
            git config user.email "196224424+musman-uk@users.noreply.github.com"
          else
            # Scheduled run → bot identity
            git config user.name "github-actions"
            git config user.email "actions@github.com"
          fi

      - name: Merge dev into backup-source (exclude workflows)
        run: |
          git fetch origin
          git checkout backup-source
          git merge origin/dev --no-commit --no-ff || true

          # Explicitly discard workflow files
          git reset HEAD .github/workflows || true
          git checkout -- .github/workflows || true

          # Commit only if there are changes
          if ! git diff --quiet; then
            git commit -m "Sync backup-source with dev (excluding workflows)"
            git push origin backup-source
          else
            echo "No changes to sync."
          fi
