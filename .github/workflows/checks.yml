name: Checks

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g markdownlint-cli markdown-toc
      - run: |
          echo '{
            "MD013": {
              "line_length": 120,
              "code_blocks": false,
              "tables": false
            }
          }' > .markdownlint.json
          markdownlint -c .markdownlint.json README.md
      - run: markdown-toc -i README.md --check

  link-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose README.md

  commit-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: wagoid/commitlint-github-action@v5
