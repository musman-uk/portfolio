name: Add Backlinks

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

jobs:
  backlinks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backlink script
        run: python .github/scripts/add_backlinks.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-add back links"
          git push
