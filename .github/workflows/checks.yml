name: Checks Before Merge to Main

on:
  workflow_dispatch:   # manual trigger
  pull_request:
    branches:
      - main           # run automatically only for PRs into main

jobs:
  commit-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Lint commits
        run: |
          echo "module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'type-enum': [2, 'always', [
                'feat','fix','chore','docs','style','refactor','perf','test'
              ]],
              'subject-case': [2, 'never', ['start-case','pascal-case','upper-case']]
            }
          };" > commitlint.config.js

          if [ \"${{ github.event_name }}\" = \"pull_request\" ]; then
            git fetch origin ${{ github.base_ref }}
            npx commitlint --from=origin/${{ github.base_ref }} --to=HEAD || npx commitlint --last
          else
            npx commitlint --last
          fi

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install Prettier + markdownlint
        run: npm install -g prettier@3.3.3 markdownlint-cli2@0.9.2
      - name: Create markdownlint config
        run: |
          echo '{
            "MD013": { "line_length": 140, "code_blocks": false, "tables": false, "headings": false, "links": false },
            "MD009": true,
            "MD019": true,
            "MD031": true,
            "MD036": true,
            "MD012": true,
            "MD022": true,
            "MD026": true,
            "default": false
          }' > .markdownlint.json
      - name: Run Prettier + markdownlint
        run: |
          find . -type f -name "*.md" -print0 | xargs -0 prettier --write --print-width 140 --prose-wrap always
          find . -type f -name "*.md" -print0 | xargs -0 markdownlint-cli2-fix
          find . -type f -name "*.md" -print0 | xargs -0 markdownlint-cli2

  link-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate links (404 + relative enforcement)
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys, urllib.parse, requests, os

          repo_url_prefix = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}"

          broken = []
          for md in pathlib.Path(".").rglob("*.md"):
              text = md.read_text(encoding="utf-8")
              for link in re.findall(r'\[.*?\]\((.*?)\)', text):
                  link = link.strip()
                  if link.startswith("#"):
                      continue
                  if link.startswith("http"):
                      if link.startswith(repo_url_prefix):
                          broken.append(f"{md}: internal link {link} → should be relative, not external")
                          continue
                      try:
                          r = requests.head(link, allow_redirects=True, timeout=10)
                          if r.status_code == 405:
                              r = requests.get(link, allow_redirects=True, timeout=10)
                          if r.status_code == 404:
                              broken.append(f"{md}: external link {link} → 404 Not Found")
                      except Exception as e:
                          broken.append(f"{md}: external link {link} → error {e}")
                  else:
                      if link.startswith("/"):
                          broken.append(f"{md}: relative link {link} → invalid absolute path")
                          continue
                      decoded = urllib.parse.unquote(link)
                      target = (md.parent / decoded).resolve()
                      if not target.exists():
                          broken.append(f"{md}: relative link {link} → 404 Not Found")
          if broken:
              print("❌ Broken links found:")
              for e in broken: print("  -", e)
              sys.exit(1)
          else:
              print("✅ All links valid.")
          EOF
