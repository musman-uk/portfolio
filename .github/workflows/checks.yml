name: Checks Before Merge To Main

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:  
  
jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g prettier@3.3.3 markdownlint-cli2@0.9.2

      - name: Prettier config
        run: |
          echo '{
            "printWidth": 140,
            "proseWrap": "always"
          }' > .prettierrc.json

      - name: Markdownlint config
        run: |
          echo '{
            "MD013": { "line_length": 140, "code_blocks": false, "tables": false, "headings": false, "links": false },
            "MD009": true,
            "MD019": true,
            "MD031": true,
            "MD036": true,
            "MD012": true,
            "MD022": true,
            "MD026": true,
            "default": false
          }' > .markdownlint.json

      - name: Run Prettier auto-fix
        run: |
          find . -type f -name "*.md" -print0 | xargs -0 prettier --write

      - name: Run markdownlint auto-fix
        run: |
          find . -type f -name "*.md" -print0 | xargs -0 markdownlint-cli2-fix

      - name: Final markdownlint check
        run: |
          find . -type f -name "*.md" -print0 | xargs -0 markdownlint-cli2

  link-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v44
      - name: Create lycheeignore
        run: |
          cat <<EOF > .lycheeignore
          EOF
      - name: Validate links in changed Markdown files
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --exclude-file .lycheeignore ${{ steps.changes.outputs.all_changed_files }}

  commit-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Create commitlint config
        run: |
          cat <<EOF > commitlint.config.js
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'type-enum': [2, 'always', [
                'feat',
                'fix',
                'chore',
                'docs',
                'style',
                'refactor',
                'perf',
                'test'
              ]],
              'subject-case': [2, 'never', ['start-case', 'pascal-case', 'upper-case']]
            }
          };
          EOF
      - name: Lint commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            if ! npx commitlint --from=origin/${{ github.base_ref }} --to=HEAD; then
              npx commitlint --last
            fi
          else
            npx commitlint --last
          fi
