name: Add Backlinks

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

jobs:
  backlinks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run backlink script
        run: node .github/scripts/add-backlinks.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-add back links"
          git push
