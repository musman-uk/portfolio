name: Checks Before Merge To Main

on:
  pull_request:
    branches:
      - main

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g markdownlint-cli markdown-toc
      - name: Lint and TOC check for all Markdown files
        run: |
          echo '{
            "MD013": {
              "line_length": 140,
              "code_blocks": false,
              "tables": false
            },
            "MD041": false,
            "MD033": false,
            "MD036": false,
            "MD034": false,
            "MD012": false,
            "MD022": true,
            "MD032": true
          }' > .markdownlint.json

          # Find all Markdown files in the repo
          files=$(find . -type f -name "*.md")

          if [ -n "$files" ]; then
            # Run markdownlint once on all Markdown files
            markdownlint -c .markdownlint.json $files
            # Run TOC check only on README.md files
            for file in $(echo "$files" | grep 'README.md$' || true); do
              markdown-toc -i "$file" --check
            done
          else
            echo "No Markdown files found."
          fi

  link-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v44
      - name: Create lycheeignore
        run: |
          cat <<EOF > .lycheeignore
          EOF
      - name: Validate links in changed Markdown files
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --exclude-file .lycheeignore ${{ steps.changes.outputs.all_changed_files }}

  commit-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Create commitlint config
        run: |
          cat <<EOF > commitlint.config.js
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'type-enum': [2, 'always', [
                'feat',
                'fix',
                'chore',
                'docs',
                'style',
                'refactor',
                'perf',
                'test'
              ]],
              'subject-case': [2, 'never', ['start-case', 'pascal-case', 'upper-case']]
            }
          };
          EOF
      - name: Lint commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            if ! npx commitlint --from=origin/${{ github.base_ref }} --to=HEAD; then
              npx commitlint --last
            fi
          else
            npx commitlint --last
          fi
