name: Checks

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g markdownlint-cli markdown-toc
      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v44
      - name: Lint and TOC check for changed READMEs
        run: |
          for file in ${{ steps.changes.outputs.all_changed_files }}; do
            if [[ $file == *README.md ]]; then
              echo '{
                "MD013": {
                  "line_length": 120,
                  "code_blocks": false,
                  "tables": false
                }
              }' > .markdownlint.json
              markdownlint -c .markdownlint.json "$file"
              markdown-toc -i "$file" --check
            fi
          done

  link-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v44
      - name: Validate links in changed READMEs
        run: |
          for file in ${{ steps.changes.outputs.all_changed_files }}; do
            if [[ $file == *README.md ]]; then
              lychee --verbose "$file"
            fi
          done

  commit-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Lint commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            if ! npx commitlint --from=origin/${{ github.base_ref }} --to=HEAD; then
              echo "Range lint failed, falling back to latest commit..."
              npx commitlint --last
            fi
          else
            echo "Push event, linting latest commit only..."
            npx commitlint --last
          fi
