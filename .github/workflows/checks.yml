name: Checks Before Merge To Main

on:
  pull_request:
    types:
      - ready_for_review
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g markdownlint-cli markdown-toc
      - name: Lint and TOC check for all Markdown files
        run: |
          echo '{
            "MD013": { "line_length": 140, "code_blocks": false, "tables": false },
            "MD009": true,
            "MD019": true,
            "MD022": true,
            "MD031": true,
            "MD032": true,
            "MD042": true,
            "default": false
          }' > .markdownlint.json

          files=$(find . -type f -name "*.md")

          if [ -n "$files" ]; then
            echo "🔎 Running markdownlint on all Markdown files..."
            # Full log
            markdownlint -c .markdownlint.json $files || true

            echo "📊 Summary by rule and file:"
            # Group errors by rule and file for readability
            markdownlint -c .markdownlint.json $files \
              | awk -F: '{print $2 " → " $1}' \
              | sort \
              | uniq -c \
              | sort -nr

            # TOC check only on README.md files
            for file in $(echo "$files" | grep 'README.md$' || true); do
              markdown-toc -i "$file" --check
            done
          else
            echo "No Markdown files found."
          fi
