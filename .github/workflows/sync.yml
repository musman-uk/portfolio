name: Sync Dev To Backup-Source

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 21 * * *"   # nightly at 21:00 UTC

jobs:
  sync:
    if: github.ref == 'refs/heads/dev'   # only run from dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Author (manual vs bot)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run → Mohammed (musman-uk) as author
            git config user.name "musman-uk"
            git config user.email "196224424+musman-uk@users.noreply.github.com"
          else
            # Scheduled run → GitHub Actions bot
            git config user.name "github-actions"
            git config user.email "actions@github.com"
          fi

      - name: Force mirror dev into backup-source (excluding workflows)
        run: |
          git fetch origin
          git checkout dev

          # Reset backup-source to dev
          git checkout -B backup-source

          # Remove workflow files
          git rm -rf .github/workflows || true

          # Commit removal if needed
          git commit -am "Sync Dev To Backup-Source (excluding workflows)" || true

          # Force push mirror
          git push origin backup-source --force

          echo "✅ backup-source now mirrors origin/dev (excluding workflows)."

      - name: Show diff summary
        run: |
          git fetch origin
          git diff --stat origin/dev origin/backup-source || true
