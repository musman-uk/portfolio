name: Mirror Sync Dev to Backup-Source

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 21 * * *"   # nightly at 21:00 UTC

jobs:
  mirror:
    if: github.ref == 'refs/heads/dev'   # only run from dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "musman-uk"
            git config user.email "196224424+musman-uk@users.noreply.github.com"
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
          fi

      - name: Mirror dev into backup-source (excluding workflows)
        run: |
          git fetch origin
          git checkout dev

          echo "Resetting backup-source to match dev..."
          git checkout -B backup-source

          # Remove workflow files before committing
          git rm -rf .github/workflows || true

          # Commit only if there are changes
          if ! git diff --quiet; then
            git commit -m "Mirror dev into backup-source (excluding workflows)" || true
            git push origin backup-source --force
            echo "✅ Mirror complete: backup-source now matches dev (excluding workflows)."
            echo "Commit summary:"
            git log -1 --stat
          else
            echo "ℹ️ No changes to mirror."
          fi
